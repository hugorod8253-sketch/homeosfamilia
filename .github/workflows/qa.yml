name: HomeOS QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run qa
      - run: npx tsc --noEmit
      - run: npm run build
